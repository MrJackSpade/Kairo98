name: Tagged Android builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for a test build'
        required: true
        default: '0.1.0-ci'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate tag and set app version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version such as 0.2.0" >&2
            exit 1
          fi
          echo "KAIRO98_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "KAIRO98_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build both APKs from this tag
        run: >-
          ./gradlew --no-daemon
          :app:assembleWithImagesDebug :app:assembleWithoutImagesDebug
          -Pkairo98VersionName="$KAIRO98_VERSION_NAME"
          -Pkairo98VersionCode="$KAIRO98_VERSION_CODE"
      - name: Verify catalog parity and artwork split
        run: >-
          python3 tools/verify_apk_variants.py
          app/build/outputs/apk/withImages/debug/app-withImages-debug.apk
          app/build/outputs/apk/withoutImages/debug/app-withoutImages-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kairo98-${{ github.ref_name }}-with-images
          path: app/build/outputs/apk/withImages/debug/app-withImages-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: kairo98-${{ github.ref_name }}-without-images
          path: app/build/outputs/apk/withoutImages/debug/app-withoutImages-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Attach APKs to beta prerelease
        if: github.event_name == 'push' && contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          with_images="$RUNNER_TEMP/Kairo98-$tag-with-images.apk"
          without_images="$RUNNER_TEMP/Kairo98-$tag-without-images.apk"
          cp app/build/outputs/apk/withImages/debug/app-withImages-debug.apk "$with_images"
          cp app/build/outputs/apk/withoutImages/debug/app-withoutImages-debug.apk "$without_images"
          notes="$RUNNER_TEMP/kairo98-beta-notes.md"
          cat > "$notes" <<'EOF'
          Android beta test build. The with-images APK includes embedded catalog artwork; the without-images APK has the same emulator features and catalog metadata without that artwork.

          These APKs are debug signed. The final source and asset license audit remains open, so this is a test build rather than a stable release.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$with_images" "$without_images" --clobber
          else
            gh release create "$tag" "$with_images" "$without_images" \
              --verify-tag --prerelease --title "Kairo98 $KAIRO98_VERSION_NAME" \
              --notes-file "$notes"
          fi
