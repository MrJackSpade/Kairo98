<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">KairoDos, the companion DOS emulator</title>
  <desc id="desc">Neon green and yellow banner linking to KairoDos for Android.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#45ff73"/>
      <stop offset="0.55" stop-color="#c9ff12"/>
      <stop offset="1" stop-color="#ffd522"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#09251a"/>
      <stop offset="1" stop-color="#06100d"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="594" height="254" rx="28" fill="#04100b" stroke="url(#edge)" stroke-width="6"/>
  <path d="M30 236H570" stroke="#45ff73" stroke-opacity=".13" stroke-width="2"/>
  <rect x="36" y="48" width="164" height="164" rx="19" fill="#d7d0ae" stroke="#ffe376" stroke-width="4"/>
  <rect x="50" y="62" width="136" height="112" rx="10" fill="url(#screen)" stroke="#283d32" stroke-width="7"/>
  <text x="63" y="98" fill="#5cff79" font-family="monospace" font-size="21" font-weight="bold">C:\&gt;</text>
  <text x="62" y="143" fill="#b6ff2a" font-family="monospace" font-size="37" font-weight="bold">K-DOS</text>
  <rect x="64" y="190" width="108" height="6" rx="3" fill="#364a3d"/>
  <text x="226" y="82" fill="#7dff90" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="4">COMPANION APP</text>
  <text x="222" y="146" fill="#e7ffde" font-family="monospace" font-size="62" font-weight="bold" letter-spacing="-3">KAIRO<tspan fill="#d9f921">DOS</tspan></text>
  <text x="226" y="180" fill="#a5b9aa" font-family="sans-serif" font-size="20">Play your DOS games on Android</text>
  <rect x="226" y="194" width="232" height="36" rx="12" fill="#132417" stroke="#a6e530" stroke-width="3"/>
  <text x="242" y="219" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">EXPLORE THE APP →</text>
</svg>
