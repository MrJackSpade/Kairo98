name: Catalog
on:
  push:
    paths:
      - 'tools/build_catalog.py'
      - 'tools/test_build_catalog.py'
      - 'tools/import_art.py'
      - 'tools/test_import_art.py'
      - 'tools/make_synthetic_catalog.py'
      - 'docs/fixtures/catalog/**'
      - 'docs/fixtures/art-source/**'
      - 'app/src/withImages/assets/art/**'
      - 'app/src/main/assets/catalog/**'
      - '.github/workflows/catalog.yml'
  pull_request:
    paths:
      - 'tools/build_catalog.py'
      - 'tools/test_build_catalog.py'
      - 'tools/import_art.py'
      - 'tools/test_import_art.py'
      - 'tools/make_synthetic_catalog.py'
      - 'docs/fixtures/catalog/**'
      - 'docs/fixtures/art-source/**'
      - 'app/src/withImages/assets/art/**'
      - 'app/src/main/assets/catalog/**'
      - '.github/workflows/catalog.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/build_catalog.py docs/fixtures/catalog/source-v1.json /tmp/kairo98-catalog
      - run: python tools/build_catalog.py docs/fixtures/catalog/source-v1.json /tmp/kairo98-catalog-2
      - run: diff -r /tmp/kairo98-catalog /tmp/kairo98-catalog-2
      - run: python tools/make_synthetic_catalog.py /tmp/kairo98-synthetic-source.json --games 10000
      - run: python tools/build_catalog.py /tmp/kairo98-synthetic-source.json /tmp/kairo98-large-catalog
      - run: du -sh /tmp/kairo98-large-catalog
      - run: python tools/build_catalog.py docs/fixtures/catalog/source-v1.json /tmp/kairo98-assets/catalog
      - run: python tools/import_art.py docs/fixtures/art-source/source-v1.json /tmp/kairo98-assets
      - run: python tools/build_catalog.py docs/fixtures/catalog/source-v1.json /tmp/kairo98-assets-2/catalog
      - run: python tools/import_art.py docs/fixtures/art-source/source-v1.json /tmp/kairo98-assets-2
      - run: diff -r /tmp/kairo98-assets /tmp/kairo98-assets-2
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-catalog-and-art
          path: /tmp/kairo98-assets/
