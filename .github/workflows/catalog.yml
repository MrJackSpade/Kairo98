name: Catalog
on:
  push:
    paths:
      - 'tools/build_catalog.py'
      - 'tools/build_review_catalog.py'
      - 'tools/audit_vndb_adult_content.py'
      - 'tools/build_online_catalog.py'
      - 'tools/test_build_catalog.py'
      - 'tools/import_art.py'
      - 'tools/test_import_art.py'
      - 'tools/make_synthetic_catalog.py'
      - 'docs/fixtures/catalog/**'
      - 'docs/fixtures/art-source/**'
      - 'kairo98/src/withImages/assets/art/**'
      - 'kairo98/src/main/assets/catalog/**'
      - 'catalog/source-v1.json'
      - 'catalog/startup-profiles-v1.json'
      - 'catalog/research/adult-content*.json'
      - 'catalog/online-v1.json'
      - 'shared'
      - 'settings.gradle.kts'
      - 'kairo98/build.gradle.kts'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/GameCatalog.kt'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/GameDetailPage.kt'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/MainActivity.kt'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/LibraryScreen.kt'
      - '.github/workflows/catalog.yml'
  pull_request:
    paths:
      - 'tools/build_catalog.py'
      - 'tools/build_review_catalog.py'
      - 'tools/audit_vndb_adult_content.py'
      - 'tools/build_online_catalog.py'
      - 'tools/test_build_catalog.py'
      - 'tools/import_art.py'
      - 'tools/test_import_art.py'
      - 'tools/make_synthetic_catalog.py'
      - 'docs/fixtures/catalog/**'
      - 'docs/fixtures/art-source/**'
      - 'kairo98/src/withImages/assets/art/**'
      - 'kairo98/src/main/assets/catalog/**'
      - 'catalog/source-v1.json'
      - 'catalog/startup-profiles-v1.json'
      - 'catalog/research/adult-content*.json'
      - 'catalog/online-v1.json'
      - 'shared'
      - 'settings.gradle.kts'
      - 'kairo98/build.gradle.kts'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/GameCatalog.kt'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/GameDetailPage.kt'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/MainActivity.kt'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/LibraryScreen.kt'
      - '.github/workflows/catalog.yml'
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Kairo frontend
        env:
          KAIRO_SHARED_DEPLOY_KEY: ${{ secrets.KAIRO_SHARED_DEPLOY_KEY }}
        run: bash tools/checkout_shared.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/build_online_catalog.py catalog/source-v1.json kairo98/src/main/assets/catalog/name-index-v1.json /tmp/online-v1.json
      - run: cmp catalog/online-v1.json /tmp/online-v1.json
      - run: python tools/build_catalog.py catalog/source-v1.json /tmp/reviewed-catalog
      - run: diff -r /tmp/reviewed-catalog/shards kairo98/src/main/assets/catalog/shards
      - run: cmp /tmp/reviewed-catalog/manifest-v1.json kairo98/src/main/assets/catalog/manifest-v1.json
      - run: python tools/build_catalog.py docs/fixtures/catalog/source-v1.json /tmp/kairo98-catalog
      - run: python tools/build_catalog.py docs/fixtures/catalog/source-v1.json /tmp/kairo98-catalog-2
      - run: diff -r /tmp/kairo98-catalog /tmp/kairo98-catalog-2
      - run: python tools/make_synthetic_catalog.py /tmp/kairo98-synthetic-source.json --games 10000
      - run: python tools/build_catalog.py /tmp/kairo98-synthetic-source.json /tmp/kairo98-large-catalog
      - run: du -sh /tmp/kairo98-large-catalog
      - run: python tools/build_catalog.py docs/fixtures/catalog/source-v1.json /tmp/kairo98-assets/catalog
      - run: python tools/import_art.py docs/fixtures/art-source/source-v1.json /tmp/kairo98-assets
      - run: python tools/build_catalog.py docs/fixtures/catalog/source-v1.json /tmp/kairo98-assets-2/catalog
      - run: python tools/import_art.py docs/fixtures/art-source/source-v1.json /tmp/kairo98-assets-2
      - run: diff -r /tmp/kairo98-assets /tmp/kairo98-assets-2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew --no-daemon :kairo98:compileWithImagesDebugKotlin :kairo98:compileWithoutImagesDebugKotlin
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-catalog-and-art
          path: /tmp/kairo98-assets/
