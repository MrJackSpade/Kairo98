<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">KairoDos, the companion DOS emulator</title>
  <desc id="desc">Neon green and yellow banner linking to KairoDos for Android.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#45ff73"/>
      <stop offset="0.55" stop-color="#c9ff12"/>
      <stop offset="1" stop-color="#ffd522"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#09251a"/>
      <stop offset="1" stop-color="#06100d"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="1194" height="254" rx="28" fill="#04100b" stroke="url(#edge)" stroke-width="6"/>
  <path d="M30 218H1170M30 236H1170M765 32V228M790 32V228" stroke="#45ff73" stroke-opacity=".13" stroke-width="2"/>
  <rect x="42" y="43" width="168" height="164" rx="19" fill="#d7d0ae" stroke="#ffe376" stroke-width="4"/>
  <rect x="57" y="57" width="138" height="112" rx="10" fill="url(#screen)" stroke="#283d32" stroke-width="7"/>
  <text x="70" y="93" fill="#5cff79" font-family="monospace" font-size="21" font-weight="bold">C:\&gt;</text>
  <text x="69" y="138" fill="#b6ff2a" font-family="monospace" font-size="37" font-weight="bold">K-DOS</text>
  <rect x="71" y="184" width="107" height="6" rx="3" fill="#364a3d"/>
  <text x="245" y="79" fill="#7dff90" font-family="monospace" font-size="25" font-weight="bold" letter-spacing="6">COMPANION APP</text>
  <text x="239" y="163" fill="#e7ffde" font-family="monospace" font-size="78" font-weight="bold" letter-spacing="-5">KAIRO<tspan fill="#d9f921">DOS</tspan></text>
  <text x="245" y="205" fill="#a5b9aa" font-family="sans-serif" font-size="23">Play your DOS games on Android</text>
  <rect x="881" y="78" width="260" height="102" rx="18" fill="#132417" stroke="#a6e530" stroke-width="3"/>
  <text x="912" y="118" fill="#dbf77b" font-family="monospace" font-size="20" font-weight="bold">EXPLORE THE</text>
  <text x="912" y="150" fill="#ffffff" font-family="monospace" font-size="24" font-weight="bold">DOS APP  →</text>
