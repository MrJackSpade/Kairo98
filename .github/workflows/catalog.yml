name: Catalog
on:
  pull_request:
    paths:
      - 'tools/catalog_research.py'
      - 'tools/catalog_config.py'
      - 'tools/catalog_index.py'
      - 'tools/artwork_references.py'
      - 'tools/test_artwork_references.py'
      - 'tools/audit_vndb_adult_content.py'
      - 'tools/test_display_text.py'
      - 'catalog/parts/**'
      - 'catalog/artwork/**'
      - 'catalog/source-v1.json'
      - 'catalog/startup-profiles-v1.json'
      - 'catalog/research/*.json'
      - 'catalog/core-v3.json'
      - 'shared'
      - 'settings.gradle.kts'
      - 'kairo98/build.gradle.kts'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/GameCatalog.kt'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/GameDetailPage.kt'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/MainActivity.kt'
      - 'kairo98/src/main/java/com/mrjackspade/kairo98/LibraryScreen.kt'
      - '.github/workflows/catalog.yml'
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Kairo frontend
        run: |
          git submodule update --init --recursive shared
          bash shared/tools/verify_checkout.sh "$(git rev-parse HEAD:shared)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s tools -p 'test_*.py'
      # The research assembled, and the catalog the shared generator builds from it.
      - run: python tools/catalog_research.py --check
      - run: python shared/tools/app_catalog.py . --check
      - run: python shared/tools/fetch_artwork.py . --check
      - uses: ./shared/.github/actions/setup-android
      - run: ./gradlew --no-daemon :kairo98:compileWithImagesDebugKotlin :kairo98:compileWithoutImagesDebugKotlin
