name: Tagged Android builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for a test build'
        required: true
        default: '0.1.0-ci'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate tag and set app version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version such as 0.2.0" >&2
            exit 1
          fi
          echo "KAIRO98_VERSION_NAME=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            IFS=. read -r major minor patch <<< "$version"
            patch=${patch%%-*}
            version_code=$((10#$major * 1000000 + 10#$minor * 100 + 10#$patch))
          else
            version_code=$GITHUB_RUN_NUMBER
          fi
          echo "KAIRO98_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "KAIRO98_ARTIFACT_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - name: Prepare persistent beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.KAIRO98_BETA_KEYSTORE_B64 }}
          KAIRO98_BETA_PASSWORD: ${{ secrets.KAIRO98_BETA_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KAIRO98_BETA_PASSWORD" ]]; then
            echo "Beta signing secrets are missing" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/kairo98-beta.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          echo "KAIRO98_BETA_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Build both release APKs and the Play bundle
        env:
          KAIRO98_BETA_PASSWORD: ${{ secrets.KAIRO98_BETA_PASSWORD }}
        run: >-
          ./gradlew --no-daemon
          :app:assembleWithImagesRelease :app:assembleWithoutImagesRelease
          :app:bundleWithoutImagesRelease
          -Pkairo98VersionName="$KAIRO98_VERSION_NAME"
          -Pkairo98VersionCode="$KAIRO98_VERSION_CODE"
      - name: Verify release signer
        shell: bash
        run: |
          expected="c321ec6b35e2509741362fcc3fede816c81510aa8133d791ea55ce0e1594a51c"
          bundle=app/build/outputs/bundle/withoutImagesRelease/app-withoutImages-release.aab
          for apk in \
            app/build/outputs/apk/withImages/release/app-withImages-release.apk \
            app/build/outputs/apk/withoutImages/release/app-withoutImages-release.apk; do
            actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
              awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected release signing certificate for $apk: $actual" >&2
              exit 1
            fi
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
              grep -F "package: name='com.loxifi.kairo98'"
          done
          jarsigner -verify "$bundle" | grep -F "jar verified"
          bundle_signer=$(keytool -printcert -jarfile "$bundle" |
            awk '/SHA256:/ {print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [[ "$bundle_signer" != "$expected" ]]; then
            echo "Unexpected Play bundle signing certificate: $bundle_signer" >&2
            exit 1
          fi
      - name: Audit distribution contents
        run: >-
          python3 tools/audit_play_release.py
          app/build/outputs/apk/withoutImages/release/app-withoutImages-release.apk
          app/build/outputs/bundle/withoutImagesRelease/app-withoutImages-release.aab
          app/build/outputs/apk/withImages/release/app-withImages-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kairo98-${{ env.KAIRO98_ARTIFACT_REF }}-non-artwork
          path: |
            app/build/outputs/apk/withoutImages/release/app-withoutImages-release.apk
            app/build/outputs/bundle/withoutImagesRelease/app-withoutImages-release.aab
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: kairo98-${{ env.KAIRO98_ARTIFACT_REF }}-with-images
          path: app/build/outputs/apk/withImages/release/app-withImages-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          with_images="$RUNNER_TEMP/Kairo98-$tag-with-images.apk"
          without_images="$RUNNER_TEMP/Kairo98-$tag-without-images.apk"
          cp app/build/outputs/apk/withImages/release/app-withImages-release.apk "$with_images"
          cp app/build/outputs/apk/withoutImages/release/app-withoutImages-release.apk "$without_images"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$with_images" "$without_images" --clobber
          else
            release_flags=()
            if [[ "$tag" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$tag" "$with_images" "$without_images" \
              --verify-tag "${release_flags[@]}" --title "Kairo98 $KAIRO98_VERSION_NAME" \
              --generate-notes
          fi
